name: Extract PDF text for search index

on:
  push:
    branches: [main]
    paths:
      - "corpus/**/*.pdf"
      - "corpus/MANIFEST.yaml"
      - "scripts/extract_pdf_text.py"
      - "scripts/requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: write

# Merges that land close together would otherwise race to push to main and
# all but one would fail. Queue runs instead; each one checks out the latest
# main, so the last run always covers everything merged before it.
concurrency:
  group: extract-pdf-text
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Extract text from corpus PDFs
        run: python scripts/extract_pdf_text.py --repo-root .

      - name: Commit updated extracted text
        run: |
          git config user.name "corpus-extraction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add corpus/_extracted/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract PDF text for search index ($(date -u +%Y-%m-%d))"
            # A push can still lose to a merge that lands mid-run; rebase onto
            # it and retry. _extracted/ is only written here, so no conflicts.
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main
            done
            exit 1
          fi
